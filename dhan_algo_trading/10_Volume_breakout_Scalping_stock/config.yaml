# Dhan Volume Breakout Scalper — non-secret configuration.
# Secrets live in .env (DHAN_CLIENT_ID, DHAN_ACCESS_TOKEN).
#
# Live trading requires BOTH:
#   system.dry_run: false
#   system.allow_live_trading: true
# Otherwise the bot fetches real market data and only simulates orders locally.
#
# Percentage values are percent units, not fractions:
#   risk.take_profit.value: 0.40  means  0.40%  (₹1,003 → TP ₹1,007.01)

strategy:
  name: "Volume Breakout Scalper"
  enabled: true

instrument:
  exchange_segment: "NSE_EQ"
  trading_symbol: "RELIANCE"
  security_id: "2885"
  # Passed to Dhan historical APIs. EQUITY for NSE_EQ / BSE_EQ.
  instrument_type: "EQUITY"
  # CNC | INTRADAY | MARGIN | MTF for equity. F&O must be INTRADAY or MARGIN.
  product_type: "INTRADAY"
  quantity: 1
  tick_size: 0.05

candles:
  # Dhan minute intervals: "1" | "5" | "15" | "25" | "60" | "DAY"
  # "5m" / "15m" forms are also accepted and normalized.
  interval: "5"
  # Completed candles retained for volume MA / EMA / breakout lookback.
  # Keep small for a 1 GB RAM VM.
  lookback: 50

volume_breakout:
  volume_ma_period: 20
  volume_multiplier: 2.0
  min_volume_ratio: 2.0
  breakout_lookback: 20
  min_breakout_percent: 0.05
  # 0 disables the maximum-breakout-distance filter.
  max_breakout_percent: 1.0
  require_volume_confirmation: true
  # true = evaluate the last COMPLETED candle only (no look-ahead).
  require_candle_confirmation: true
  # If true, breakout uses only the immediately previous candle high/low.
  use_previous_candle_high_low: false
  # If true, breakout uses the rolling N-candle high/low (N = breakout_lookback).
  use_rolling_high_low: true
  # 0 disables the body-quality filter.
  min_candle_body_percent: 0.0
  # 0 disables the range-quality filter.
  max_candle_range_percent: 0.0

trend_filter:
  enabled: true
  ema_fast: 9
  ema_slow: 21
  long_only_above_ema: true
  short_only_below_ema: true

risk:
  take_profit:
    enabled: true
    # percentage | points | absolute
    mode: "percentage"
    value: 0.40

  stop_loss:
    enabled: true
    mode: "percentage"
    value: 0.20

  trailing_stop:
    enabled: false
    activation_percent: 0.20
    distance_percent: 0.10

  # 0 disables the maximum-holding-time exit.
  max_holding_seconds: 0
  max_trades_per_day: 5
  max_consecutive_losses: 3
  max_daily_loss: 2000
  daily_profit_target: 3000
  one_position_at_a_time: true
  cooldown_seconds: 60
  # If true, a daily-loss / profit-target / consecutive-loss breach also flattens.
  close_on_risk_limit: false
  # Optional estimate subtracted from displayed P&L. Labelled as an estimate.
  estimated_cost_per_trade: 0

trading:
  long_enabled: true
  short_enabled: true
  # MARKET or LIMIT. LIMIT is never silently converted to MARKET.
  order_type: "MARKET"

  day_trading:
    enabled: true
    start_time: "09:20"
    stop_entry_time: "15:15"
    force_exit_time: "15:20"
    close_all_positions_at_end: true

  stop_bot_after_tp: true
  stop_bot_after_sl: true
  # If true, live mode waits for a console "yes" before starting. Keep false on AWS.
  live_trading_confirmation: false
  # If true, python stop.py also flattens the open position.
  close_positions_on_stop: false

system:
  polling_seconds: 5
  timezone: "Asia/Kolkata"
  dry_run: true
  allow_live_trading: false

execution:
  order_timeout_seconds: 15
  order_status_poll_seconds: 2
  retry_attempts: 3
  retry_delay_seconds: 2
  validity: "DAY"
  # Compare local state vs Dhan positions every N poll cycles.
  reconcile_every_cycles: 6
  # OFFSET_PERCENT: buy slightly above LTP, sell slightly below LTP.
  # ABSOLUTE: use limit_price as the exact LIMIT price.
  limit_price_mode: "OFFSET_PERCENT"
  limit_offset_percent: 0.1
  limit_price: 0

safety:
  prevent_duplicate_orders: true
  require_market_hours: true
  close_positions_on_error: false
  cancel_pending_orders: true
  manage_only_configured_symbol: true
  require_flat_before_entry: true
  block_if_unexpected_position: true

logging:
  level: "INFO"
  file_enabled: true
  file_name: "volume_breakout_algo.log"

cli:
  enabled: true
  # Dashboard redraw interval. Does not call Dhan by itself.
  refresh_seconds: 1
  show_indicators: true
  show_signal: true
  show_orders: true
  event_history_size: 8
