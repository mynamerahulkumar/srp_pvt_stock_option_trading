# Dhan Opening Range Breakout — non-secret configuration.
# Secrets live in .env (DHAN_CLIENT_ID, DHAN_ACCESS_TOKEN).
#
# Live trading requires BOTH:
#   safety.dry_run: false
#   safety.allow_live_trading: true
# Otherwise the bot fetches real market data and only simulates orders locally.

app:
  name: "Dhan ORB Algo"
  environment: "paper"
  log_level: "INFO"
  polling_seconds: 5

market:
  exchange_segment: "NSE_EQ"
  trading_symbol: "RELIANCE"
  security_id: "2885"
  # Passed to Dhan historical APIs. EQUITY for NSE_EQ / BSE_EQ.
  instrument_type: "EQUITY"
  tick_size: 0.05

strategy:
  enabled: true

  opening_range:
    start_time: "09:15"
    end_time: "09:30"

  breakout:
    buffer_points: 0.0
    buffer_percent: 0.0
    # false = use points if > 0 else percent. true = apply percent then points.
    apply_both: false
    # 0 = fire on first LTP print beyond the level.
    # N >= 1 = require N consecutive completed 1-minute closes beyond the level.
    confirmation_candles: 1

  direction:
    allow_long: true
    allow_short: true

  entry:
    order_type: "MARKET"
    product_type: "INTRADAY"

risk:
  quantity: 1

  stop_loss:
    enabled: true
    type: "PERCENT"
    value: 1.0

  take_profit:
    enabled: true
    type: "PERCENT"
    value: 2.0

  max_trades_per_day: 1

  max_daily_loss:
    enabled: true
    value: 2000

  # If true, a daily-loss breach also flattens an open position and stops the bot.
  close_on_risk_limit: false
  # Optional estimate subtracted from displayed P&L. Labelled as an estimate.
  estimated_cost_per_trade: 0

day_trading:
  enabled: true
  force_exit_enabled: true
  force_exit_time: "15:15"
  timezone: "Asia/Kolkata"

trading_session:
  start_time: "09:15"
  stop_new_entries_time: "15:00"
  timezone: "Asia/Kolkata"

execution:
  order_timeout_seconds: 15
  order_status_poll_seconds: 2
  retry_attempts: 3
  retry_delay_seconds: 2
  validity: "DAY"
  # Compare local state vs Dhan positions every N poll cycles.
  reconcile_every_cycles: 6
  # OFFSET_PERCENT: buy slightly above LTP, sell slightly below LTP.
  # ABSOLUTE: use limit_price as the exact LIMIT price.
  limit_price_mode: "OFFSET_PERCENT"
  limit_offset_percent: 0.1
  limit_price: 0

safety:
  dry_run: true
  allow_live_trading: false
  prevent_duplicate_orders: true
  require_market_hours: true
  close_positions_on_stop: false
  close_positions_on_session_end: true
  close_positions_on_tp_sl: true
  close_positions_on_error: false
  cancel_pending_orders: true
  manage_only_configured_symbol: true
  require_flat_before_entry: true
  block_if_unexpected_position: true

logging:
  file_enabled: true
  file_name: "orb_algo.log"
  level: "INFO"

cli:
  enabled: true
  # Dashboard redraw interval. Does not call Dhan by itself.
  refresh_seconds: 1
  show_indicators: true
  show_signal: true
  show_orders: true
  event_history_size: 8
